<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUTD Engineering Past Questions Hub</title>
    <script src="https://paystack.co"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f3f7f5; margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); max-width: 650px; width: 100%; border-top: 8px solid #005A36; box-sizing: border-box; }
        h1 { color: #005A36; text-align: center; margin-bottom: 5px; font-size: 22px; }
        .subtitle { text-align: center; color: #555; margin-bottom: 20px; font-size: 13px; }
        .auth-container { display: flex; flex-direction: column; gap: 20px; width: 100%; }
        .auth-box { background: #fdfdfd; padding: 15px; border: 1px solid #e2ece7; border-radius: 8px; }
        .auth-box h2 { color: #005A36; margin-top: 0; font-size: 16px; border-bottom: 1px solid #e2ece7; padding-bottom: 5px; }
        label { font-weight: bold; color: #2c3e50; display: block; margin-top: 15px; font-size: 14px; }
        select, input { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; background: white; }
        optgroup { font-weight: bold; color: #005A36; background: #f4f9f6; }
        option { font-weight: normal; color: #333; background: white; }
        .btn { width: 100%; margin-top: 20px; padding: 14px; background-color: #005A36; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .logout-link { display: block; text-align: right; font-size: 12px; color: #c0392b; font-weight: bold; text-decoration: none; margin-bottom: 10px; }
        .viewer-card { margin-top: 20px; border: 2px solid #005A36; border-radius: 8px; overflow: hidden; }
        .viewer-header { background: #005A36; color: white; padding: 10px; font-weight: bold; text-align: center; font-size: 13px; }
        .noselect { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    </style>
</head>
<body class="noselect">

    <div class="container">
        <h1>📚 FUTD Faculty of Engineering Hub</h1>
        <p class="subtitle">Federal University of Transportation, Daura • 100L - 500L Materials</p>

        {% if not logged_in %}
        <div class="auth-container">
            <div class="auth-box">
                <h2>🔐 Engineering Student Login</h2>
                <form action="/login" method="POST">
                    <input type="text" name="username" placeholder="Username" required autocomplete="off">
                    <input type="password" name="password" placeholder="Password" required style="margin-top: 8px;">
                    <button type="submit" class="btn" style="margin-top: 12px; padding: 10px;">Log In</button>
                </form>
            </div>
            <div class="auth-box">
                <h2>📝 Register New Profile</h2>
                <form action="/signup" method="POST">
                    <input type="text" name="username" placeholder="Choose Username" required autocomplete="off">
                    <input type="password" name="password" placeholder="Create Password" required style="margin-top: 8px;">
                    <button type="submit" class="btn" style="margin-top: 12px; padding: 10px; background-color: #2ecc71;">Create Account</button>
                </form>
            </div>
        </div>
        {% else %}
        
        <a href="/logout" class="logout-link">🚪 Log Out ({{ current_user }})</a>

        {% if not show_viewer %}
        <!-- CATEGORIZED MATERIAL SELECTOR -->
        <label for="file_name">Choose Engineering Material (₦1,000 per pack):</label>
        <select id="file_name" required>
            
            <!-- CIVIL ENGINEERING -->

            </optgroup>

            <!-- MECHANICAL ENGINEERING -->

                <option value="MECH_100L_2023_2027.pdf">Mechanical Engineering - 100L Pack (2023 - 2027) — ₦1,000</option>
                <option value="MECH_200L_2023_2027.pdf">Mechanical Engineering - 200L Pack (2023 - 2027) — ₦1,000</option>
                <option value="MECH_300L_2023_2027.pdf">Mechanical Engineering - 300L Pack (2023 - 2027) — ₦1,000</option>
                <option value="MECH_400L_2023_2027.pdf">Mechanical Engineering - 400L Pack (2023 - 2027) — ₦1,000</option>
                <option value="MECH_500L_2023_2027.pdf">Mechanical Engineering - 500L Pack (2023 - 2027) — ₦1,000</option>

            <!-- MECHATRONICS ENGINEERING -->

                <option value="MECHA_200L_2023_2027.pdf">Mechatronics Engineering - 200L Pack (2023 - 2027) — ₦1,000</option>
                <option value="MECHA_300L_2023_2027.pdf">Mechatronics Engineering - 300L Pack (2023 - 2027) — ₦1,000</option>
                <option value="MECHA_400L_2023_2027.pdf">Mechatronics Engineering - 400L Pack (2023 - 2027) — ₦1,000</option>

        </select>

        <button type="button" class="btn" onclick="payWithPaystack()">💳 Securely Process Payment (₦1,000)</button>

        <script>
            function payWithPaystack() {
                const selectedFile = document.getElementById('file_name').value;
                const paystackPublicKey = "pk_test_c9249225a54811fc961374";

                let handler = PaystackPop.setup({
                    key: paystackPublicKey,
                    email: "student_payment@futd.edu.ng",
                    amount: 1000 * 100, // Updated dynamically to ₦1000 in kobo (100000)
                    currency: "NGN",
                    ref: 'FUTD_' + Math.floor((Math.random() * 1000000000) + 1),
                    callback: function(response) {
                        fetch('/verify_payment', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                reference: response.reference,
                                file_name: selectedFile
                            })
                        })
                        .then(res => res.json())
                        .then(data => {
                            if (data.status === "success") {
                                alert("🎉 Payment Verified! Opening your engineering material pack now...");
                                window.location.href = "/read/" + selectedFile;
